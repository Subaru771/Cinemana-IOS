name: Build Cinemana Loader (encrypted USB handoff beta)
on:
  workflow_dispatch:
  push:
    branches: [build/cinemana-sidestore-v08]
    paths:
      - '.github/workflows/build-cinemana-loader-v08.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - name: Checkout pinned upstream (MIT)
        shell: pwsh
        run: |
          git clone https://github.com/nab138/iloader.git upstream-iloader
          git -C upstream-iloader checkout 96ed06124d7a859692a5ec2864e1b47998d4904c
      - name: Patch independent fork
        shell: pwsh
        run: python patches/apply_iloader_v08.py upstream-iloader
      - name: Verify UI and compile
        working-directory: upstream-iloader
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          bun run build
          cd src-tauri
          cargo check
      - name: Build native installer
        working-directory: upstream-iloader
        shell: pwsh
        run: bun run tauri build --bundles nsis
      - name: Publish PRIVATE pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem upstream-iloader/src-tauri/target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          if (!$exe) { throw 'No NSIS executable was created.' }
          gh release create "cinemana-loader-v08-$($env:GITHUB_SHA.Substring(0,12))" $exe.FullName --draft --prerelease --target $env:GITHUB_SHA --title 'Cinemana Loader v0.8 USB handoff test' --notes 'Independent iLoader MIT fork. NOT device verified. Do not use for public distribution until branding assets are replaced and security reviewed.'
