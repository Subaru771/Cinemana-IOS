name: Cinemana CEE Android TV APK
on:
  push:
    branches: [cee-ios-v0.1.0]
    paths:
      - 'cee-android/**'
      - '.github/workflows/android-cee.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android command line SDK
        run: |
          set -eux
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed debug APK
        working-directory: cee-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify and checksum APK
        run: |
          set -eux
          mkdir -p dist
          cp cee-android/app/build/outputs/apk/debug/app-debug.apk dist/Cinemana-CEE-TV-v0.2.0-Test-Signed.apk
          test -s dist/Cinemana-CEE-TV-v0.2.0-Test-Signed.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Cinemana-CEE-TV-v0.2.0-Test-Signed.apk
          (cd dist && sha256sum Cinemana-CEE-TV-v0.2.0-Test-Signed.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Cinemana-CEE-TV-v0.2.0-Test-Signed-APK
          path: |
            dist/Cinemana-CEE-TV-v0.2.0-Test-Signed.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish separate CEE Android prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=cinemana-cee-tv-v0.2.0-test
          APK=dist/Cinemana-CEE-TV-v0.2.0-Test-Signed.apk
          SHA=dist/SHA256SUMS.txt
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SHA" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" "$SHA" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Cinemana CEE Android TV v0.2.0 — Test APK" --notes "Separate experimental CEE edition. Web player fallback; native poster grid is website-dependent. TEST/DEBUG-SIGNED APK, NOT a production release. The original CinemanaTV app is unaffected." --prerelease --latest=false
          fi
