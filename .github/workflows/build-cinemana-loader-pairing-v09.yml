name: Build Cinemana Loader v0.9 automatic SideStore pairing
on:
  workflow_dispatch:
  push:
    branches: [build/cinemana-sidestore-v09-full]
    paths:
      - '.github/workflows/build-cinemana-loader-pairing-v09.yml'
      - 'patches/apply_iloader_pairing_v09.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - name: Checkout pinned upstream (MIT)
        shell: pwsh
        run: |
          git clone https://github.com/nab138/iloader.git upstream-iloader
          git -C upstream-iloader checkout 96ed06124d7a859692a5ec2864e1b47998d4904c
      - name: Patch independent fork
        shell: pwsh
        run: python patches/apply_iloader_pairing_v09.py upstream-iloader
      - name: Verify UI and compile
        working-directory: upstream-iloader
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          bun run build
          cd src-tauri
          cargo check
      - name: Build native pairing-enabled installer
        working-directory: upstream-iloader
        shell: pwsh
        run: bun run tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: cinemana-loader-v09-pairing-test
          path: upstream-iloader/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 3
          if-no-files-found: error
