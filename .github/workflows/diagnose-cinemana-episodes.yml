name: Diagnose Cinemana episode lookup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-cinemana-episodes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query episode metadata without recording media URLs
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, urllib.error, urllib.request
          base = "https://cinemana.shabakaty.com/api/android/"
          query = base64.b64encode("Danganronpa".encode()).decode().rstrip("=")
          headers = {"User-Agent":"CinemanaMobile/1.0 (iOS)","Accept":"application/json"}
          def fetch(path):
              try:
                  req = urllib.request.Request(base+path, headers=headers)
                  with urllib.request.urlopen(req,timeout=18) as r:
                      obj=json.loads(r.read(4_000_000))
                  return obj, None
              except Exception as e:
                  return None, f"{type(e).__name__}: {str(e)[:180]}"
          def entries(obj, depth=0):
              if depth>5: return []
              if isinstance(obj,list):
                  return [x for item in obj for x in entries(item,depth+1)]
              if not isinstance(obj,dict): return []
              found = [obj] if obj.get("nb") or obj.get("id") else []
              for k in ("info","data","items","result","results","videos","content","list","episodes","seasons"):
                  if k in obj: found.extend(entries(obj[k],depth+1))
              return found
          candidates = {}
          for kind in (1,2):
              path = f"video/V/2/videoKind/{kind}/itemsPerPage/20/video_title_search/{query}"
              data,error = fetch(path)
              print("SEARCH",kind,"error=",error,"container=",type(data).__name__,"keys=",list(data)[:16] if isinstance(data,dict) else None)
              for item in entries(data):
                  title=str(item.get("en_title") or item.get("title") or "")
                  if "danganronpa" in title.lower() and (item.get("nb") or item.get("id")):
                      key=str(item.get("nb") or item["id"])
                      candidates[key]=title
                      print("MATCH", "id=",key,"title=",title[:100],"kind=",item.get("kind"),"episode=",item.get("episodeNummer"))
          print("TOTAL_IDS",len(candidates))
          for sid,title in list(candidates.items())[:12]:
              for prefix in ("videoSeason/id/","allVideoInfo/id/"):
                  data,error=fetch(prefix+sid)
                  children=entries(data)
                  print("DETAIL",sid,prefix,"error=",error,"shape=",type(data).__name__,
                        "count=",len(children),"top_keys=",list(data)[:20] if isinstance(data,dict) else [],
                        "samples=",[
                            {k:item.get(k) for k in ("nb","season","episodeNummer","en_title","kind") if k in item}
                            for item in children[:3]])
          PY
