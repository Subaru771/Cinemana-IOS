
name: Cinemana iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone app
        run: |
          xcodebuild \
            -project CinemanaMobile.xcodeproj \
            -scheme CinemanaMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/CinemanaMobile.app dist/Payload/
          cd dist
          zip -r Cinemana-iOS.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cinemana-iOS-v1.3-Unsigned
          path: dist/Cinemana-iOS.ipa
