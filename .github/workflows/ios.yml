name: Cinemana iOS — unsigned build
on:
  workflow_dispatch:
  push:
    branches: [main, build/ios-v2.1.1-refined-ipa]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out complete, versioned source tree
        uses: actions/checkout@v4
      - name: Prepare Retina splash without cropping approved design
        run: |
          sips -s format png --resampleHeightWidth 5016 2823 \
            CinemanaMobile/Assets.xcassets/CinemanaSplash.imageset/CinemanaSplash.jpg \
            --out CinemanaMobile/Assets.xcassets/CinemanaSplash.imageset/CinemanaSplash-3x.png
      - name: Verify version, artwork, download UI and localization
        run: |
          grep -q "CFBundleShortVersionString: '2.1.1'" project.yml
          python3 scripts/validate_branding.py
          python3 scripts/check_download_menu.py
          python3 scripts/check_landing_locales.py
          python3 scripts/check_launch_autoplay.py
          python3 scripts/check_episode_browser.py
          python3 scripts/check_scene_skipping.py
          plutil -lint CinemanaMobile/en.lproj/Localizable.strings
          plutil -lint CinemanaMobile/ar.lproj/Localizable.strings
      - name: Verify included app icon source
        run: swift scripts/make_app_icon.swift
      - name: Run portable model / quality / subtitle / local-data tests
        run: |
          swiftc -o "$RUNNER_TEMP/cinemana-tests" \
            CinemanaMobile/Models.swift \
            CinemanaMobile/CinemanaAPI.swift \
            CinemanaMobile/PlaybackPlanner.swift \
            CinemanaMobile/OfflineModels.swift \
            CinemanaMobile/Subtitles.swift \
            CinemanaMobile/HLSQuality.swift \
            CinemanaMobile/Personalization.swift \
            CinemanaMobile/MatureContentFilter.swift \
            CinemanaMobile/SceneSkipPlanner.swift \
            CinemanaMobile/CommunitySkipTimes.swift \
            CinemanaMobile/ExternalSceneMarkers.swift \
            Tests/CoreSmokeTests.swift
          "$RUNNER_TEMP/cinemana-tests"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build for physical iOS devices without developer signing
        run: |
          xcodegen generate
          xcodebuild \
            -project CinemanaMobile.xcodeproj \
            -scheme CinemanaMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify bundle metadata and package real unsigned IPA
        run: |
          set -eu
          APP=build/Build/Products/Release-iphoneos/CinemanaMobile.app
          test -d "$APP"
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")" = '2.1.1'
          test "$(plutil -extract CFBundleDisplayName raw "$APP/Info.plist")" = 'Cinemana iOS'
          test -s "$APP/Assets.car"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -q -r Cinemana-iOS-v2.1.1-beta.1-Unsigned.ipa Payload)
          unzip -tq dist/Cinemana-iOS-v2.1.1-beta.1-Unsigned.ipa
          shasum -a 256 dist/Cinemana-iOS-v2.1.1-beta.1-Unsigned.ipa > dist/SHA256SUMS.txt
      - name: Publish private-repo beta IPA to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="ci-cinemana-ios-v2.1.1-72acefc"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Cinemana-iOS-v2.1.1-beta.1-Unsigned.ipa dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/Cinemana-iOS-v2.1.1-beta.1-Unsigned.ipa dist/SHA256SUMS.txt \
              --target "72acefc3365f818de1939452052df3a90514578d" \
              --title "Cinemana iOS v2.1.1 beta — unsigned IPA" --prerelease \
              --notes "Device-testing build; unsigned for SideStore or compatible sideload tooling. iOS 16+. Built from PR #33; not merged into main."
          fi
      - name: Export unsigned IPA bytes for authenticated GitHub connector handoff
        run: |
          echo CINEMANA_IPA_B64_BEGIN
          base64 -i dist/Cinemana-iOS-v2.1.1-beta.1-Unsigned.ipa | tr -d '\\n' | fold -w 2048
          echo CINEMANA_IPA_B64_END
