
name: Cinemana iOS v1.6.12 Approved Splash

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore v1.6.11 source and apply approved splash
        run: |
          test -s ci-sources/Cinemana-iOS-v1.6.11.zip
          mkdir -p /tmp/cinemana-restore
          unzip -q ci-sources/Cinemana-iOS-v1.6.11.zip -d /tmp/cinemana-restore
          test -f /tmp/cinemana-restore/Cinemana-iOS-v1.6.11/project.yml
          rsync -a --exclude .github /tmp/cinemana-restore/Cinemana-iOS-v1.6.11/ ./
          python3 scripts/apply_approved_splash.py
          python3 scripts/validate_branding.py

      - name: Validate English and Arabic website
        run: python3 scripts/check_landing_locales.py

      - name: Validate streamlined download menu
        run: python3 scripts/check_download_menu.py

      - name: Verify autoplay and fast startup
        run: python3 scripts/check_launch_autoplay.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Cinemana icon
        run: swift scripts/make_app_icon.swift

      - name: Run portable core tests
        run: |
          swiftc -o /tmp/cinemana-core-tests \
            CinemanaMobile/Models.swift \
            CinemanaMobile/CinemanaAPI.swift \
            CinemanaMobile/PlaybackPlanner.swift \
            CinemanaMobile/OfflineModels.swift \
            CinemanaMobile/Subtitles.swift \
            CinemanaMobile/HLSQuality.swift \
            Tests/CoreSmokeTests.swift
          /tmp/cinemana-core-tests

      - name: Validate native English and Arabic translations
        run: |
          plutil -lint CinemanaMobile/en.lproj/Localizable.strings
          plutil -lint CinemanaMobile/ar.lproj/Localizable.strings

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone app
        run: |
          xcodebuild \
            -project CinemanaMobile.xcodeproj \
            -scheme CinemanaMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify v1.6.12 bundle metadata
        run: |
          APP=build/Build/Products/Release-iphoneos/CinemanaMobile.app
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")" = '1.6.12'
          test "$(plutil -extract CFBundleDisplayName raw "$APP/Info.plist")" = 'Cinemana iOS'
          test -f "$APP/Assets.car"

      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/CinemanaMobile.app dist/Payload/
          cd dist
          zip -r Cinemana-iOS.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cinemana-iOS-v1.6.12-Unsigned
          path: dist/Cinemana-iOS.ipa
