name: Cinemana CEE iOS — unsigned IPA
on:
  push:
    branches: [cee-ios-v0.1.0]
    paths: ['CinemanaMobile/**', 'project.yml', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent CEE app entry point
        run: |
          set -eux
          grep -q 'struct CinemanaCEEApplication: App' CinemanaMobile/CEEApplication.swift
          grep -q 'app.cinemana.cee.ios' project.yml
          test "$(grep -rl '@main' CinemanaMobile --include='*.swift' | wc -l | tr -d ' ')" = "1"
          swiftc -frontend -parse CinemanaMobile/CEEApplication.swift
      - name: Prepare original Cinemana assets
        run: |
          swift scripts/make_app_icon.swift
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build iOS device application (unsigned)
        run: |
          set -eux
          xcodegen generate
          xcodebuild -project CinemanaMobile.xcodeproj -scheme CinemanaMobile -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package and verify real compiled IPA
        run: |
          set -eux
          APP=build/Build/Products/Release-iphoneos/CinemanaMobile.app
          test -d "$APP"
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")" = 'app.cinemana.cee.ios'
          test "$(plutil -extract CFBundleDisplayName raw "$APP/Info.plist")" = 'Cinemana CEE'
          mkdir -p dist/Payload
          ditto "$APP" dist/Payload/CinemanaMobile.app
          (cd dist && zip -q -r Cinemana-CEE-iOS-v0.1.0-Unsigned.ipa Payload)
          unzip -tq dist/Cinemana-CEE-iOS-v0.1.0-Unsigned.ipa
          shasum -a 256 dist/Cinemana-CEE-iOS-v0.1.0-Unsigned.ipa > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Cinemana-CEE-iOS-v0.1.0-Unsigned
          path: |
            dist/Cinemana-CEE-iOS-v0.1.0-Unsigned.ipa
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish separate CEE prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=cinemana-cee-ios-v0.1.0-unsigned
          IPA=dist/Cinemana-CEE-iOS-v0.1.0-Unsigned.ipa
          SHA=dist/SHA256SUMS.txt
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" "$SHA" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$IPA" "$SHA" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Cinemana CEE iOS v0.1.0 — Unsigned IPA" --notes "Experimental CEE version: website playback fallback, native poster discovery subject to CEE page structure. Unsigned IPA; sign with SideStore to install." --prerelease --latest=false
          fi
