name: Cinemana iOS — unsigned build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CinemanaMobile/**'
      - 'project.yml'
      - '.github/workflows/ios.yml'
      - 'scripts/**'
      - 'Tests/**'
permissions:
  contents: write
concurrency:
  group: cinemana-ios-latest-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - name: Check out complete, versioned source tree
        uses: actions/checkout@v4
      - name: Prepare Retina splash without cropping approved design
        run: |
          sips -s format png --resampleHeightWidth 5016 2823 \
            CinemanaMobile/Assets.xcassets/CinemanaSplash.imageset/CinemanaSplash.jpg \
            --out CinemanaMobile/Assets.xcassets/CinemanaSplash.imageset/CinemanaSplash-3x.png
      - name: Verify version, artwork, download UI and localization
        run: |
          grep -q "CFBundleShortVersionString: '2.0.2'" project.yml
          python3 scripts/validate_branding.py
          python3 scripts/check_download_menu.py
          python3 scripts/check_landing_locales.py
          python3 scripts/check_launch_autoplay.py
          python3 scripts/check_ios_localizations.py
          plutil -lint CinemanaMobile/en.lproj/Localizable.strings
          plutil -lint CinemanaMobile/ar.lproj/Localizable.strings
      - name: Verify included app icon source
        run: swift scripts/make_app_icon.swift
      - name: Run portable model / quality / subtitle / local-data tests
        run: |
          swiftc -o "$RUNNER_TEMP/cinemana-tests" \
            CinemanaMobile/Models.swift \
            CinemanaMobile/CinemanaAPI.swift \
            CinemanaMobile/PlaybackPlanner.swift \
            CinemanaMobile/OfflineModels.swift \
            CinemanaMobile/Subtitles.swift \
            CinemanaMobile/HLSQuality.swift \
            CinemanaMobile/Personalization.swift \
            CinemanaMobile/MatureContentFilter.swift \
            Tests/CoreSmokeTests.swift
          "$RUNNER_TEMP/cinemana-tests"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build for physical iOS devices without developer signing
        run: |
          xcodegen generate
          xcodebuild \
            -project CinemanaMobile.xcodeproj \
            -scheme CinemanaMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify bundle metadata and package real unsigned IPA
        run: |
          set -eu
          APP=build/Build/Products/Release-iphoneos/CinemanaMobile.app
          test -d "$APP"
          plutil -replace CinemanaBuildRevision -string "$GITHUB_SHA" "$APP/Info.plist"
          test "$(plutil -extract CinemanaBuildRevision raw "$APP/Info.plist")" = "$GITHUB_SHA"
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")" = '2.0.2'
          test "$(plutil -extract CFBundleDisplayName raw "$APP/Info.plist")" = 'Cinemana iOS'
          test -s "$APP/Assets.car"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -q -r Cinemana-iOS-v2.0.2-beta.1-Unsigned.ipa Payload)
          unzip -tq dist/Cinemana-iOS-v2.0.2-beta.1-Unsigned.ipa
          shasum -a 256 dist/Cinemana-iOS-v2.0.2-beta.1-Unsigned.ipa > dist/SHA256SUMS.txt
      - name: Upload real IPA and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Cinemana-iOS-v2.0.2-beta.1-Unsigned
          path: |
            dist/Cinemana-iOS-v2.0.2-beta.1-Unsigned.ipa
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
      - name: Publish direct-download IPA on GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Older builds must not overwrite the newest published IPA.
          HEAD="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$HEAD" != "$GITHUB_SHA" ]; then
            echo "Skipping stale release upload for $GITHUB_SHA"
            exit 0
          fi
          TAG=cinemana-ios-latest-unsigned
          IPA=dist/Cinemana-iOS-v2.0.2-beta.1-Unsigned.ipa
          CHECKSUM=dist/SHA256SUMS.txt
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" "$CHECKSUM" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "Unsigned Cinemana iOS IPA rebuilt from main. Source commit: ${GITHUB_SHA}. Sign with SideStore before installing."
          else
            gh release create "$TAG" "$IPA" "$CHECKSUM" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Cinemana iOS — Latest unsigned IPA" \
              --notes "Unsigned Cinemana iOS IPA built from main. Source commit: ${GITHUB_SHA}. Sign with SideStore before installing." \
              --prerelease --latest=false
          fi
