name: Cinemana TV scene markers — Android test APK
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cinemana-tv-android.yml'
      - 'ci-sources/CinemanaTV-v1.4.8-Scene-Markers-SOURCE.zip'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled GitHub runner Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools"
      - name: Install Android 35 SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Unpack TV sources
        run: |
          test -s ci-sources/CinemanaTV-v1.4.8-Scene-Markers-SOURCE.zip
          unzip -q ci-sources/CinemanaTV-v1.4.8-Scene-Markers-SOURCE.zip -d /tmp/cinemana-tv-source
          test -f /tmp/cinemana-tv-source/CinemanaTV-v1.4.8/app/build.gradle.kts
      - name: Unit tests and installable debug APK
        working-directory: /tmp/cinemana-tv-source/CinemanaTV-v1.4.8
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK and checksum
        run: |
          set -eu
          mkdir -p dist
          cp /tmp/cinemana-tv-source/CinemanaTV-v1.4.8/app/build/outputs/apk/debug/app-debug.apk dist/CinemanaTV-v1.4.8-Scene-Markers-DEBUG.apk
          test -s dist/CinemanaTV-v1.4.8-Scene-Markers-DEBUG.apk
          unzip -tq dist/CinemanaTV-v1.4.8-Scene-Markers-DEBUG.apk
          sha256sum dist/CinemanaTV-v1.4.8-Scene-Markers-DEBUG.apk > dist/SHA256SUMS.txt
      - name: Upload smoke-test APK
        uses: actions/upload-artifact@v4
        with:
          name: CinemanaTV-v1.4.8-Scene-Markers-Debug-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30
