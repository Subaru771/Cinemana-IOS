name: CinemanaMobile
options:
  bundleIdPrefix: app.cinemana
  deploymentTarget:
    iOS: '16.0'
  developmentLanguage: en
targets:
  CinemanaMobile:
    type: application
    platform: iOS
    sources:
      - CinemanaMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cinemana.mobile.ios
        SWIFT_VERSION: '5.9'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    info:
      path: CinemanaMobile/Info.plist
      properties:
        CFBundleDisplayName: Cinemana iOS
        CFBundleShortVersionString: '2.0.5'
        CFBundleVersion: '26'
        CFBundleLocalizations:
          - en
          - ar
        UILaunchScreen:
          UIColorName: CinemanaLaunchBackground
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
